version: 2

# Scheduled dependency updates, so the default route to clearing an advisory is
# an upgrade rather than an entry in .github/dependency-exceptions.json.
#
# Grouped by risk rather than by package: a single "patch + minor for dev
# tooling" PR is reviewable, whereas 40 individual PRs get rubber-stamped.
# Major bumps stay ungrouped and individual — those need real review.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ['minor', 'patch']
      prod-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ['patch']
    ignore:
      # Pinned to the Node line CI and the Railway image run (see .nvmrc);
      # bumping the type definitions past the runtime major causes confusing
      # type errors for APIs that are not actually available.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Payments path. 3.x -> 6.x crosses three majors that moved peer
      # requirements and Elements mounting behaviour; the failure mode is
      # customers unable to check out. Upgrade deliberately against Stripe's
      # migration guide with a payment smoke test, not on a weekly cadence.
      - dependency-name: '@stripe/react-stripe-js'
        update-types: ['version-update:semver-major']
      # ESLint environment table. Majors add and remove environment keys, so a
      # key our eslint.config still references disappearing is a repo-wide lint
      # failure — real breakage for no runtime benefit.
      - dependency-name: 'globals'
        update-types: ['version-update:semver-major']
      # React majors. packages/web runs React 18; #1445 (react-router 7 -> 8)
      # merged green-ish but v8 peers react >=19.2.7, so it pulled the hoisted
      # React 19 in beside the app's React 18 (two Reacts, invalid hook call)
      # and broke web tsc; reverted in #1451. React 19 is a planned migration
      # — react, react-dom and react-router move together, deliberately.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      # vitest 5 is a planned migration (#1611): @vitest/* siblings must move
      # together and the voice-quality reporter tooling is pinned to the shape.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # testcontainers 12 requires undici features missing on Node 20.20.2
      # (dispatch-presence-redis integration test fails at module load, #1591).
      - dependency-name: 'testcontainers'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testcontainers/*'
        update-types: ['version-update:semver-major']

  # packages/mobile is not a root workspace and carries its own lockfile, so
  # the root entry above does not cover it.
  - package-ecosystem: npm
    directory: '/packages/mobile'
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    open-pull-requests-limit: 3
    groups:
      mobile-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
    ignore:
      # Expo SDK majors move react-native, react, and the whole native module
      # set together; they are migrations, not dependency bumps.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      # Expo SDK 52 pins react 18.3.x and @types/react to match (react-dom
      # 18.3.1 peer conflict on a bare react bump caused a CI ERESOLVE —
      # #1449). react, @types/react and react-dom move together with the
      # Expo SDK upgrade via `npx expo install`, not independently.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      # Expo SDK 52 pins @react-native-community/netinfo 11.4.x; v12 is
      # outside the SDK's supported range (#1448). Moves with the Expo SDK
      # upgrade via `npx expo install`.
      - dependency-name: '@react-native-community/netinfo'
        update-types: ['version-update:semver-major']
      # The expo-* module set is versioned in lockstep with the SDK train, not
      # independently: expo-file-system 18 -> 57 and expo-notifications 0.29 ->
      # 57 were both just "align to SDK 57", and both rewrote their public API
      # on the way. Bumping one alone desyncs packages/mobile against the
      # others. Same reasoning as the two entries above, applied to the modules
      # rather than the SDK package — a wildcard because the set keeps growing
      # and enumerating it means a new ignore rule every time a module is added.
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      # jest-expo is released per SDK (52 -> 57 is "align to SDK 57"); it must
      # track the installed expo major. #1325 (52 -> 57) failed e2e.
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      # react-native is 0.x, so an RN "minor" (0.76 -> 0.87) is really an SDK
      # train change; #1324 grouped it (plus SDK-53+ expo-* minors) as a
      # "minor-patch" update against expo ~52 and failed test + e2e. RN and the
      # expo-* modules move only with an Expo SDK upgrade.
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-minor']
      # nativewind 4.2 pulls react-native-css-interop 0.2, whose Babel preset
      # names react-native-worklets/plugin (Reanimated 4 / SDK 54+). On SDK 52
      # + Reanimated 3 every Metro bundle then fails (Maestro run 36765536371).
      # Pinned to 4.1.x until the Expo SDK upgrade; src/dev/babelToolchain.test.ts
      # guards the pairing.
      - dependency-name: 'nativewind'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        applies-to: version-updates
        update-types: ['minor', 'patch']
    ignore:
      # Used by every workflow in the repo, so a bad bump breaks all of CI at
      # once rather than one job. v5 -> v7 also crosses two majors that change
      # the runtime and default fetch/auth behaviour. Pin deliberately.
      - dependency-name: 'actions/checkout'
        update-types: ['version-update:semver-major']
      # v2 replaced the action's input contract outright (payload/method
      # superseded the webhook-style inputs), so our `with:` blocks are not
      # forward-compatible — a major here is a rewrite of the call sites, and
      # the failure mode is silently broken alerting.
      - dependency-name: 'slackapi/slack-github-action'
        update-types: ['version-update:semver-major']

  # Base images in /Dockerfile. Both are digest-pinned, which is deterministic
  # but does not self-update — an unwatched digest pin is how a service ends up
  # on an unpatched nginx for a year. This is the update path that makes the pin
  # safe to hold. Weekly rather than monthly: these carry OS-level CVEs, and a
  # base-image bump is a one-line diff that CI fully covers.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Major-only. Node 20 -> 26 is six majors and changes the *production
      # runtime*, crossing native-ABI/OpenSSL/ICU boundaries — every native
      # module needs rebuilding and it lands on Railway. That is a planned
      # migration, coordinated with .nvmrc and the CI Node version so the three
      # do not drift apart.
      #
      # Deliberately scoped to majors so this entry keeps doing the job the
      # comment above describes: node:20.x.y patch bumps, which are what
      # actually carry the Alpine/OpenSSL CVE fixes, still come through.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
