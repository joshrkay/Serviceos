# VQ2-016 — Voice Quality v1 Layer 2 pre-deploy gate.
#
# Runs the Layer 2 corpus suite (AudioModeDriver + 2-of-3 voting +
# caller-experience graders) against the InMemory repo bundle on every
# push to a `release/*` branch. This is the spend-bearing pre-deploy
# check that must pass before the release branch is shipped.
#
# Provider (#1331): the SAME gateway config production runs — Railway
# prod/dev set AI_PROVIDER_BASE_URL=https://api.openai.com/v1 +
# AI_PROVIDER_API_KEY with gpt-4o-mini (default/lightweight/standard) and
# gpt-4o (complex); the suite builds its gateway with createLLMGateway from
# these vars. ANTHROPIC_API_KEY is deliberately NOT wired — production does not
# use Anthropic (and that account is out of credit).
#
# Cost shape: each Layer 2 run hits the real OpenAI API (LLM + Whisper + TTS).
# `VOICE_QUALITY_COST_CAP_CENTS=1000` ($10) is the per-suite ceiling
# enforced by the runner (see runner-layer2.ts SUITE_COST_CAP_CENTS_DEFAULT).
# The concurrency group + `cancel-in-progress: false` ensures two
# back-to-back release/* pushes don't double-spend.
#
# This is a GATE — the Layer 2 step does NOT use `continue-on-error`.
# If the corpus regresses below threshold the release does not ship.
# Override procedure: docs/superpowers/runbooks/voice-quality-launch-gate.md
# (Layer 2 section added in VQ2-019).
name: Voice Quality Layer 2 (pre-deploy)

on:
  push:
    branches: ["release/*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  layer2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Per-ref group so different release branches can run in parallel,
      # but two pushes to the same release branch serialize.
      group: voice-quality-layer2-${{ github.ref }}
      cancel-in-progress: false   # don't cancel; cost already incurred
    env:
      # #1331 — the agent + judges run on the provider production runs
      # (Railway prod/dev), built by createLLMGateway from these vars.
      AI_PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_PROVIDER_BASE_URL: https://api.openai.com/v1
      AI_DEFAULT_MODEL: gpt-4o-mini
      AI_LIGHTWEIGHT_MODEL: gpt-4o-mini
      AI_STANDARD_MODEL: gpt-4o-mini
      AI_COMPLEX_MODEL: gpt-4o
      # Classify deadline: the production value from
      # docs/runbooks/live-ai-restore.md (code default is 4s).
      AI_CLASSIFY_INTENT_DEADLINE_MS: '12000'
      # Whisper STT + OpenAI TTS (the speech legs).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOICE_QUALITY_LAYER2: 'true'
      VOICE_QUALITY_REPO: memory
      # $10 — ~2x the gpt-4o-mini projection (ci-workflow-layer2-provider.test.ts
      # pins projection <= cap <= 3x projection).
      VOICE_QUALITY_COST_CAP_CENTS: '1000'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify API keys are present
        run: |
          if [ -z "$AI_PROVIDER_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::AI_PROVIDER_API_KEY / OPENAI_API_KEY is not set (secrets.OPENAI_API_KEY) — Layer 2 was not executed."
            echo "This workflow cannot pass without real API keys — skipped tests do not constitute a green gate."
            exit 1
          fi
          echo "API keys verified present."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Run voice quality Layer 2 suite
        id: layer2
        run: npm run voice-quality:layer2 --workspace=packages/api
      - name: Upload Layer 2 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-quality-layer2-report
          path: |
            packages/api/voice-quality-layer2-report.json
            packages/api/voice-quality-layer2-failures/*.json
      # Cosmetic post-step: best-effort PR comment when the release
      # branch happens to be associated with an open PR. Failures here
      # MUST NOT fail the gate (the gate verdict is the Layer 2 step
      # itself), so this step explicitly opts into continue-on-error.
      - name: Post Layer 2 summary to PR (if release/* branch is in a PR)
        if: always() && github.event_name == 'push'
        run: npx ts-node .github/scripts/post-voice-quality-pr-comment.ts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: packages/api/voice-quality-layer2-report.json
