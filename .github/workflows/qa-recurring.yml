name: QA Recurring Daily

on:
  schedule:
    # Every day at 04:00 UTC (true recurring interval across month boundaries)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      previous_run:
        description: 'Previous run date (YYYY-MM-DD) for comparison'
        required: false
        type: string

jobs:
  qa-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download previous artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          path: qa/reports-temp
        continue-on-error: true

      - name: Restore previous reports
        run: |
          if [ -d "qa/reports-temp" ]; then
            find qa/reports-temp -type d -maxdepth 1 | tail -n +2 | while read dir; do
              date_dir=$(basename "$dir")
              mkdir -p "qa/reports/$date_dir"
              cp "$dir"/* "qa/reports/$date_dir/" 2>/dev/null || true
            done
          fi

      - name: Run QA suite
        run: |
          chmod +x ./scripts/qa-comparison.sh
          PREVIOUS_ARG=""
          if [[ -n "${{ github.event.inputs.previous_run }}" ]]; then
            PREVIOUS_ARG="--previous ${{ github.event.inputs.previous_run }}"
          fi
          ./scripts/qa-comparison.sh --verbose $PREVIOUS_ARG

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_id }}
          path: qa/reports/*/
          retention-days: 90

      - name: Check QA results
        run: |
          # Verify QA reports were created
          if [ -d "qa/reports" ]; then
            echo "QA reports directory created"
            find qa/reports -name "qa-status.json" | head -5
          else
            echo "Warning: QA reports directory not found"
          fi
