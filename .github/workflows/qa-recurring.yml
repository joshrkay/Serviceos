name: QA Recurring Daily

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  qa-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA suite
        run: |
          chmod +x ./scripts/qa-comparison.sh
          ./scripts/qa-comparison.sh --verbose
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_id }}
          path: qa/reports/*/
          retention-days: 90

      - name: Check QA results
        if: always()
        run: |
          if [ -d "qa/reports" ]; then
            echo "QA reports directory created"
            find qa/reports -name "qa-status.json" | head -5
          else
            echo "Warning: QA reports directory not found"
          fi
