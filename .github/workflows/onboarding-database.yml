name: Onboarding database verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: serviceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d serviceos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/serviceos_test
      DB_SSL: 'false'
      E2E_USE_TEST_DB: 'true'
      E2E_DEV_AUTH: '0'
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      # Synthetic fixtures only. No Clerk cloud, Stripe request or phone purchase.
      STRIPE_SECRET_KEY: sk_test_hermetic_release
      STRIPE_WEBHOOK_SECRET: whsec_hermetic_release
      TELEPHONY_ENABLED: 'false'
      EMAIL_ENABLED: 'false'
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/onboarding-results.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Verification policy regressions
        run: node --test scripts/release/*.test.mjs
      - name: Install browser and database client
        run: |
          sudo rm -f /etc/apt/sources.list.d/deadsnakes-* /etc/apt/sources.list.d/ondrej-* /etc/apt/sources.list.d/microsoft-prod* || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          # WebKit (iOS Safari's engine) runs the v3 voice spec (E2E_V3_WEBKIT=1 below): owner
          # decision 7 of slice S3, both browsers from day one, at ~1-2 min of CI.
          npx playwright install --with-deps chromium webkit
      - name: Migrate before API webServer starts
        run: npx tsx e2e/fixtures/setup-test-db.ts
      - name: Onboarding against real Postgres
        run: >-
          npx playwright test --project=chromium --retries=0 --reporter=list,json
          e2e/journeys/signup-to-first-estimate.hermetic.spec.ts
          e2e/journeys/onboarding-signup-webhook.spec.ts
          e2e/journeys/onboarding-identity.spec.ts
      - name: Require every selected journey to execute and pass
        if: always()
        run: node scripts/release/verify.mjs test-results/onboarding-results.json
      # "Pick, don't build" onboarding (v3): its own config boots the API on this
      # Postgres (prepare-db migrates and seeds one price tier) and the SPA with
      # the v3 flag on. Nothing mocked: the draft is created, read and approved
      # through the real routes. See e2e/onboarding-v3.config.ts.
      - name: Pick-don't-build onboarding against real Postgres
        if: always()
        env:
          E2E_V3_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/serviceos_test
          # Adds the onboarding-v3-webkit project: gesture-unlocked playback and audio/mp4 recording.
          E2E_V3_WEBKIT: '1'
          # Absolute: the json reporter resolves a relative path against the config dir (e2e/).
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-results/onboarding-v3-results.json
        run: npx playwright test -c e2e/onboarding-v3.config.ts --reporter=list,json
      - name: Require the v3 journey to execute and pass
        if: always()
        run: node scripts/release/verify.mjs test-results/onboarding-v3-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: onboarding-database-results
          path: |
            test-results/onboarding-results.json
            test-results/onboarding-v3-results.json
          retention-days: 7
