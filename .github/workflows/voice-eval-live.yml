# Voice Eval — LIVE intent + slot accuracy against the production model.
#
# The 92% intent-accuracy / 0.88 slot-micro-F1 quality bar is only meaningful
# when measured against the REAL model. The PR-time voice-quality gate replays
# cassettes (a canned classifier), so real-model regressions are invisible until
# the Layer-2 release gate. This scheduled job closes that gap: it routes a
# held-out corpus sample through the production classifier (classifyIntent)
# behind the Layer-2 real gateway and enforces the thresholds with --gate.
#
# NOT PR-blocking — it runs on a weekly cron + manual dispatch, never on
# pull_request. A --gate failure turns this run red (a visible quality
# regression signal); it does not block merges.
#
# #839 — each run is also compared against its committed live baseline
# (packages/voice-eval/baselines/*-live.json). Those start as placeholders, so
# this run exits 4 until the owner records them: dispatch with
# record_baseline=true and commit the uploaded voice-eval-live-baselines
# artifact (or run each file's recordCommand locally with a key).
#
# Provider: the SAME gateway config production runs (as agent-path-smoke.yml,
# #1426). Railway prod/dev set AI_PROVIDER_BASE_URL=https://api.openai.com/v1 +
# AI_PROVIDER_API_KEY with gpt-4o-mini (default/lightweight/standard) and
# gpt-4o (complex); the runners build the classifier's gateway with the
# production factory (createLLMGateway(loadConfig(env))) from these vars.
# ANTHROPIC_API_KEY is deliberately NOT wired — production does not use
# Anthropic, so a green run on it would measure the wrong provider.
#
# Cost shape: each run hits the real OpenAI API for the classify calls.
# Spend is bounded two ways: --max-utterances caps the sample size, and a
# per-step VOICE_EVAL_COST_CAP_CENTS makes each script abort (exit 3) BEFORE
# spending if its conservative projection exceeds the cap. No Postgres/Docker/ffmpeg — the
# classifier with a gateway needs no DB (repo deps are not exercised).
name: Voice Eval Live (intent + slot)

on:
  schedule:
    - cron: '0 7 * * 1'   # Monday 07:00 UTC (offset from the Layer-2 weekly at 06:00)
  workflow_dispatch:
    inputs:
      record_baseline:
        description: 'Record the live baselines (packages/voice-eval/baselines/*-live.json) instead of comparing; download the voice-eval-live-baselines artifact and commit it'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_PROVIDER_BASE_URL: https://api.openai.com/v1
      AI_DEFAULT_MODEL: gpt-4o-mini
      AI_LIGHTWEIGHT_MODEL: gpt-4o-mini
      AI_STANDARD_MODEL: gpt-4o-mini
      AI_COMPLEX_MODEL: gpt-4o
      # Classify deadline: the production value from
      # docs/runbooks/live-ai-restore.md (code default is 4s).
      AI_CLASSIFY_INTENT_DEADLINE_MS: '12000'
      # #839 — compare each live run against its committed baseline
      # (baselines/*-live.json; exit 1 on a regression past tolerance, exit 4
      # while the file is still an unrecorded placeholder), or — on a manual
      # dispatch with record_baseline — write fresh baselines to commit.
      BASELINE_FLAG: ${{ inputs.record_baseline && '--record-baseline' || '--baseline' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify API key is present
        run: |
          if [ -z "$AI_PROVIDER_API_KEY" ]; then
            echo "::error::AI_PROVIDER_API_KEY is not set (secrets.OPENAI_API_KEY) — live voice eval was not executed."
            echo "A missing credential is an unmet external prerequisite, not a green gate."
            exit 1
          fi
          echo "API key present."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install deps
        id: install
        run: npm ci
      # Per-script cost ceilings (cents), set PER STEP so each cap is sized to
      # its own --max-utterances sample (#839: a single $5 cap sat below both
      # samples' projections, so every keyed run would have aborted with exit
      # 3 before classifying anything). Each runner projects cost
      # conservatively — no cache discount, EST_SYSTEM_PROMPT_TOKENS headroom,
      # priced per model (gpt-4o-mini at OpenAI list $0.15/$0.60 per MTok) —
      # and aborts before spending if the projection exceeds the cap; the same
      # cap then bounds recorded spend row by row. Caps are ~2.5x the
      # projection; ci-workflow-voice-eval-live.test.ts also fails if a cap
      # drifts past 3x (a stale cap sized for a pricier model).
      # ci-workflow-voice-eval-live.test.ts fails if a sample outgrows its cap.
      - name: Live intent eval (gated, sampled)
        env:
          VOICE_EVAL_COST_CAP_CENTS: '150'    # projection ~63c at N=200 (gpt-4o-mini)
        run: |
          set -o pipefail
          npx tsx packages/voice-eval/run-intent-eval.ts --live --gate --max-utterances 200 "$BASELINE_FLAG" packages/voice-eval/baselines/intent-live.json \
            | tee voice-eval-live-report.txt
      # Runs even when the intent eval failed, so one run reports both.
      - name: Live slot eval (gated, sampled)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          VOICE_EVAL_COST_CAP_CENTS: '80'     # projection ~32c at N=100 (gpt-4o-mini)
        run: |
          set -o pipefail
          npx tsx packages/voice-eval/run-slot-eval.ts --live --gate --max-utterances 100 "$BASELINE_FLAG" packages/voice-eval/baselines/slot-live.json \
            | tee -a voice-eval-live-report.txt
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-eval-live-report
          path: voice-eval-live-report.txt
          retention-days: 90
      - name: Upload recorded live baselines
        if: ${{ always() && inputs.record_baseline }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-eval-live-baselines
          path: packages/voice-eval/baselines/*-live.json
          retention-days: 90
