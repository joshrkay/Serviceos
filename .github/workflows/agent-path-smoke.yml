# Real-LLM path smoke over the critical agent graph (book / quote / escalate /
# negotiate / complaint / Spanish). Complements the mock Layer-1 voice-quality
# gate: this actually calls the production classifier with a live model.
#
# Provider: the SAME gateway config production runs. Railway prod/dev set
# AI_PROVIDER_BASE_URL=https://api.openai.com/v1 + AI_PROVIDER_API_KEY with
# gpt-4o-mini (default/lightweight/standard) and gpt-4o (complex); the script
# builds the gateway with the production factory (createLLMGateway) from these
# vars. ANTHROPIC_API_KEY is deliberately NOT wired here — production does not
# use Anthropic, so a green run on it would prove the wrong provider.
#
# Cost: 11 classify calls, capped at AGENT_PATH_SMOKE_COST_CAP_CENTS (default $1).
# Missing credentials fail as an explicit unmet prerequisite; they are never
# reported as green execution evidence.
name: Agent Path Smoke

on:
  pull_request:
    paths:
      - 'packages/api/src/ai/**'
      - 'packages/api/scripts/agent-path-smoke.ts'
      - 'packages/api/scripts/agent-graph-coverage.ts'
      - 'packages/api/src/ai/voice-quality/**'
      - '.github/workflows/agent-path-smoke.yml'
  workflow_dispatch:
  schedule:
    # Daily 06:30 UTC — offset from voice-eval-live Monday job
    - cron: '30 6 * * *'

permissions:
  contents: read

jobs:
  path-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_PROVIDER_BASE_URL: https://api.openai.com/v1
      AI_DEFAULT_MODEL: gpt-4o-mini
      AI_LIGHTWEIGHT_MODEL: gpt-4o-mini
      AI_STANDARD_MODEL: gpt-4o-mini
      AI_COMPLEX_MODEL: gpt-4o
      # Classify deadline: the production value from
      # docs/runbooks/live-ai-restore.md (code default is 4s).
      AI_CLASSIFY_INTENT_DEADLINE_MS: '12000'
      # ~$1 cap; 11 gpt-4o-mini classify calls project to a few cents.
      AGENT_PATH_SMOKE_COST_CAP_CENTS: '100'
      AGENT_PATH_SMOKE_PASS_RATIO: '0.8'
      AGENT_PATH_SMOKE_OUT: agent-path-smoke-report.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Offline graph coverage (always meaningful)
        run: npm run agent:graph-coverage --workspace=packages/api -- --gate --markdown
      - name: Verify API key is present
        run: |
          if [ -z "$AI_PROVIDER_API_KEY" ]; then
            echo "::error::AI_PROVIDER_API_KEY is not set (secrets.OPENAI_API_KEY) — real-LLM path smoke was not executed."
            echo "A missing credential is an unmet external prerequisite, not a green gate."
            exit 1
          fi
          echo "API key present."
      - name: Real-LLM path smoke (gated)
        run: |
          set -o pipefail
          npm run agent:path-smoke --workspace=packages/api -- --gate \
            | tee agent-path-smoke-console.txt
      - name: Upload path-smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-path-smoke-report
          path: |
            agent-path-smoke-report.json
            agent-path-smoke-console.txt
          retention-days: 90
          if-no-files-found: ignore
