name: Deploy
on:
  push:
    branches: [main]

# CI gate for pushes to main — this workflow does NOT deploy anything.
#
# Railway deploys main itself: the api and web services are attached to the
# repo and auto-deploy on every push to main, with "Wait for CI" holding each
# deploy until the GitHub checks pass. So the `test` and `voice-quality-gate`
# jobs below are what stand between a push to main and a Railway deploy.
# Deploy mechanics (build, preDeployCommand migration, healthcheck, rollout)
# live in railway.toml / packages/web/railway.toml and docs/deployment.md.
#
# The workflow is still named "Deploy" on purpose: deploy-retry.yml triggers
# on workflow_run of "Deploy" and would silently stop firing if it were
# renamed.

# Serial pipeline: never cancel an in-flight run for a race to start a new
# one. cancel-in-progress: false so a fast second push queues behind the
# first instead of tearing down a run already underway.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Deployment helper regression tests
        run: bash scripts/ci/test/run-tests.sh
      - name: Web security header contract
        run: npm run test:web-security-headers

      - name: Type check API (build config)
        run: npx tsc --project tsconfig.build.json --noEmit
        working-directory: packages/api
      - name: Type check Web
        run: npx tsc --noEmit
        working-directory: packages/web

      - name: Owner-loop critical path — §11 H2
        run: npx vitest run test/owner-loop-critical-path.test.ts
        working-directory: packages/api
        env:
          NODE_ENV: test

      - name: Voice smoke (synthetic) — §11 H2 Layer A
        # Fast structural gate: Media Streams server attaches and the
        # documented upgrade contract is stable. Tier-2 promotion will
        # add the full canned-audio → CreateBooking assertion.
        # See docs/runbooks/launch-quality-bar.md.
        run: npx vitest run test/voice/voice-smoke.synthetic.test.ts
        working-directory: packages/api
        env:
          NODE_ENV: test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Pre-pull Postgres test image
        run: docker pull pgvector/pgvector:pg16

      - name: Integration tests
        run: npm run test:integration
        working-directory: packages/api
        env:
          TEST_DB: testcontainers

      - name: Coverage check
        run: npm run test:coverage

      - name: Per-module coverage thresholds (PRD §13)
        run: npx ts-node scripts/check-coverage.ts
        working-directory: packages/api

      - name: Migration dry-run
        run: npm run migrate:dryrun
        working-directory: packages/api

  # WS7 — Layer-1 voice-quality corpus gate on the DEPLOY path.
  #
  # pr-checks.yml runs Layer 1 on PRs and voice-quality-pre-deploy.yml runs
  # Layer 2 on release/* branches, but a direct push to `main` (the branch
  # Railway auto-deploys) previously deployed with NO voice gate at all.
  # This job closes that hole: it runs the same corpus suite with the
  # launch-gate ENFORCED (VOICE_QUALITY_ENFORCE_LAUNCH_GATE=true makes
  # scripts/merge-voice-quality-report.ts exit non-zero when the launch gate
  # fails), and Railway's "Wait for CI" holds main's deploy until it passes.
  voice-quality-gate:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run voice quality Layer 1 suite (launch gate enforced)
        run: npm run voice-quality --workspace=packages/api
        env:
          VOICE_QUALITY_ENFORCE_LAUNCH_GATE: 'true'
      # #839 — the voice-eval baseline gate on the deploy path too (same
      # offline comparisons as PR Checks' voice-eval-gate job).
      - name: Intent eval vs committed baseline
        run: npx tsx packages/voice-eval/run-intent-eval.ts --gate --baseline packages/voice-eval/baselines/intent-offline.json
      - name: Slot eval vs committed baseline
        run: npx tsx packages/voice-eval/run-slot-eval.ts --gate --baseline packages/voice-eval/baselines/slot-offline.json
      - name: Upload voice quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-voice-quality-report
          path: packages/api/voice-quality-report.json
