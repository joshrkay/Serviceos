name: TEMP route manifest snapshot update

on:
  push:
    branches: [feat/pick-dont-build-s5a-retire-sent-links]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Update route manifest snapshot
        run: npx vitest run -u test/app/route-manifest.test.ts
        working-directory: packages/api
        env:
          NODE_ENV: test
      - name: Upload updated snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: route-manifest-snapshot
          path: packages/api/test/app/__snapshots__/route-manifest.test.ts.snap
