# Railway build config — api stage targets the Node.js production image.
# This file is linked to the WEB service. The worker service (PROCESS_ROLE=
# worker) links railway.worker.toml — same build, no preDeployCommand (the
# web service runs migrations), no overlapSeconds (no public traffic to
# drain). See docs/deployment.md "Deploy topology (web + worker)".
[build]
dockerfilePath = "Dockerfile"
dockerfileTarget = "api"

[deploy]
# Keep startup focused on serving traffic; run DB migrations as a separate
# one-off/release step (CI/CD or Railway pre-deploy command).
preDeployCommand = "node packages/api/dist/src/db/migrate.js"
startCommand = "node packages/api/dist/src/index.js"
# Liveness probe — /health is always 200 when the server is up. Not /ready:
# /ready 503s on a cold/unreachable DB and would roll back healthy deploys.
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Horizontal scale: keep this at 1. This service answers phone calls, and a live
# call's session lives in the memory of the replica that took it, so a second
# replica drops calls at the stream connect or on the next Gather turn. Every
# call-answering process (every PROCESS_ROLE except worker) stays at ONE replica
# until session state is externalized (LCR-05). Redis and PgBouncer do not make
# a second replica safe: Redis shares counters and call events, not calls.
# Boot guard: validateFeatureRequiredConfig (packages/api/src/shared/config.ts)
# refuses to start in prod/staging with NUM_REPLICAS > 1 on any role but worker,
# and with NUM_REPLICAS > 1 and no REDIS_URL on any role (ARCH-01). It only sees
# the NUM_REPLICAS service variable, so set NUM_REPLICAS to the real replica
# count (this value, or the autoscale max) whenever the replica count changes.
# Leave metric-based autoscaling (Railway service settings) off for this
# service. See docs/runbooks/scaling.md.
numReplicas = 1
# Zero-downtime rollout: keep the old replica serving until the new one is
# healthy. The app drains live voice/WS calls on SIGTERM (U-P4a) — it flips
# /ready to 503, rejects new WS upgrades, then waits DRAIN_TIMEOUT_MS (25s) for
# active calls before tearing down, with a SHUTDOWN_FORCE_EXIT_MS (30s) backstop.
# Railway's stop grace period must exceed the backstop (>= 35s) or live calls are
# SIGKILLed mid-drain.
overlapSeconds = 35
# Port routing is intentionally NOT pinned here. The app honors Railway's
# injected PORT (packages/api/src/index.ts: `process.env.PORT || 3000`) and
# listens on it, so Railway's edge routes to that same port automatically.
# Hardcoding `port = 3000` previously misrouted traffic ("Application not
# found") whenever the injected PORT differed (Railway's default is 8080) —
# see docs/verification-runs/beta-verification-2026-05-13.md. Leaving it
# unset keeps the listen port and the edge target in lockstep regardless of
# the service's PORT value.

# PgBouncer (scale-to-1000): add a PgBouncer service in transaction mode
# (pool_mode=transaction) in front of the Postgres plugin, point this service's
# DATABASE_URL at PgBouncer, and set DATABASE_DIRECT_URL to the Postgres plugin's
# direct URL (session-scoped locks + LISTEN/NOTIFY bypass PgBouncer — see
# .env.production.example and docs/runbooks/scaling.md). Only the worker service
# may run more than one replica (see numReplicas above). The app drains the pg
# pool(s) on SIGTERM (app.ts shutdown handler).
