# PRD 5.4 (#1018) phase A — capture a voice note with no signal.
# Real Android airplane mode (Maestro setAirplaneMode is Android-only, per
# research #1002). The clip must be journaled (offline-queue.json) and its
# audio kept under files/offline-audio/ — scripts/maestro-device-run.sh reads
# both over `adb run-as` after this flow and records the idempotency key.
appId: com.serviceos.app
name: PRD 5.4 A — offline capture is journaled
tags:
  - prd-5.4
---
# App state is reset by the harness (reset_app), not clearState — see
# scripts/maestro-device-run.sh.
- launchApp:
    clearState: false
    permissions:
      all: allow
- runFlow: subflows/signed-in.yaml
# The memo tab (labelled "Voice" since #1603).
- tapOn: "Voice"
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible: "You're offline.*"
    timeout: 30000
- assertVisible: "Hold to record"
# Start on the accessible mic control, not a screen percentage: the "Speak
# answers aloud" row moved the mic below the old 42% coordinate, so that
# gesture never pressed it (run 37653971884). A slow downward swipe keeps the
# pointer inside the mic for several seconds before releasing at its edge.
# Maestro's fixed ~3-second longPressOn is too short for cold MediaRecorder
# startup on this emulator (run 36772438631).
- swipe:
    from:
      text: "Hold to record"
    direction: DOWN
    duration: 30000
- extendedWaitUntil:
    visible: "Saved offline"
    timeout: 30000
- assertVisible: "You're offline — 1 action waiting\\."
- takeScreenshot: prd-5.4-a-offline-queued
