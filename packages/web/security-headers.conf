# Shared response-header directives for every response from the web edge.
# Included at server scope and repeated in locations that define their own
# add_header directives, because nginx otherwise suppresses inherited headers.

# Clerk: the production publishable key (pk_live_) encodes the Frontend API host
# clerk.therivetapp.com — a custom domain that neither *.clerk.com nor
# *.clerk.accounts.dev matches. clerk-js itself is served from that host, so
# omitting it blanks /login and /signup. challenges.cloudflare.com +
# *.protect.clerk.com are Clerk's sign-up bot protection (Turnstile script +
# iframe). Dev keeps working via *.clerk.accounts.dev. Reference:
# https://clerk.com/docs/guides/secure/best-practices/csp-headers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://clerk.therivetapp.com https://*.clerk.com https://*.clerk.accounts.dev https://clerk.com https://challenges.cloudflare.com https://*.protect.clerk.com https://cdn.pendo.io https://us-assets.i.posthog.com 'sha256-lENftx+7152rVD4twAey4nIX8X+7mNlgZFtJB6y2e+I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.clerk.com https://clerk.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com https://clerk.therivetapp.com https://*.clerk.com https://clerk.com https://*.clerk.accounts.dev https://*.protect.clerk.com:* wss://api.deepgram.com https://us.i.posthog.com https://us-assets.i.posthog.com https://data.pendo.io https://*.storage.googleapis.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.clerk.com https://challenges.cloudflare.com https://*.protect.clerk.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
